services:
  - type: web
    name: ritmo-habitos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ritmo-db
          property: connectionString
      - key: HABITS_API_TOKEN
        generateValue: true

databases:
  - name: ritmo-db
    plan: basic-256mb